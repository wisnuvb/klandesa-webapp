name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # mobile/ adalah anggota workspace pnpm, jadi satu install dari root cukup untuk web dan mobile.
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - name: Web typecheck
        run: pnpm exec tsc --noEmit
      - name: Web lint
        run: pnpm lint
      - name: Web unit tests
        run: pnpm test:unit
      - name: Mobile typecheck
        run: pnpm --filter klandesa-mobile typecheck
      - name: Mobile lint
        run: pnpm --filter klandesa-mobile lint
      - name: Mobile tests
        run: pnpm --filter klandesa-mobile test
